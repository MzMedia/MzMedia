; ABLMediaServer 配置文件（为 mz-media 测试与集成预调优）
[ABLMediaServer]
secret=mzmedia_zlm_secret_2026_test_key
mediaServerID=abl_default
ServerIP=127.0.0.1
localipAddress=127.0.0.1

; 核心服务端口（偶数端口为 HTTP/明文，奇数端口加载 SSL）
httpServerPort=9000
httpFlvPort=9001
wsFlvPort=9002
httpMp4Port=9003
hlsPort=9004
rtspPort=5544
rtmpPort=1936
ps_tsRecvPort=10002
1078Port=7078

; 功能开关与转码配置
hook_enable=1
enable_audio=1
hls_enable=1
hlsCutType=2
h265CutType=2
pushEnable_mp4=0
fileSecond=3600
fileKeepMaxTime=7
httpDownloadSpeed=0
G711ConvertAAC=1
convertMaxObject=16
noneReaderDuration=30
keepaliveDuration=10
MaxDiconnectTimeoutSecond=15

; 路径配置
recordPath=/opt/abl/record
picturePath=/opt/abl/picture

; Webhook 事件回调（默认回调宿主机 yudao-server 48080 端口，可按需修改）
on_server_started=http://host.docker.internal:48080/index/hook/abl/on_server_started
on_server_keepalive=http://host.docker.internal:48080/index/hook/abl/on_server_keepalive
on_play=http://host.docker.internal:48080/index/hook/abl/on_play
on_publish=http://host.docker.internal:48080/index/hook/abl/on_publish
on_stream_arrive=http://host.docker.internal:48080/index/hook/abl/on_stream_arrive
on_stream_not_arrive=http://host.docker.internal:48080/index/hook/abl/on_stream_not_arrive
on_stream_none_reader=http://host.docker.internal:48080/index/hook/abl/on_stream_none_reader
on_stream_disconnect=http://host.docker.internal:48080/index/hook/abl/on_stream_disconnect
on_stream_not_found=http://host.docker.internal:48080/index/hook/abl/on_stream_not_found
on_record_mp4=http://host.docker.internal:48080/index/hook/abl/on_record_mp4
on_delete_record_mp4=http://host.docker.internal:48080/index/hook/abl/on_delete_record_mp4
on_record_progress=http://host.docker.internal:48080/index/hook/abl/on_record_progress

; WebRTC 扩展配置
rtc.listening-ip=0.0.0.0
rtc.listening-port=9005
rtc.external-ip=127.0.0.1
rtc.min-port=31000
rtc.max-port=31050
