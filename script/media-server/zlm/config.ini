; ZLMediaKit 配置文件（为 mz-media 测试与集成预调优）
[api]
apiDebug=1
defaultSnap=./www/logo.png
secret=mzmedia_zlm_secret_2026_test_key
snapRoot=./www/snap/

[ffmpeg]
bin=/usr/bin/ffmpeg
cmd=%s -re -i %s -c:a aac -strict -2 -ar 44100 -ab 48k -c:v libx264 -align_delay_ms 0 -pcr_period 20 -f flv %s
log=./ffmpeg/ffmpeg.log
restart_sec=0
snap=%s -rtsp_transport tcp -i %s -y -f mjpeg -frames:v 1 %s

[general]
check_nvidia_dev=1
enableVhost=0
flowThreshold=1024
maxStreamWaitMS=15000
mediaServerId=default
mergeWriteMS=0
resetWhenRePublish=1
streamNoneReaderDelayMS=20000
unPushStreamDelayMS=15000
wait_add_track_ms=3000
wait_track_ready_ms=10000

[hls]
broadcastRecordTs=0
deleteDelaySec=0
fileBufSize=65536
filePath=./www
segDuration=2
segNum=3
segRetain=0

[hook]
admin_params=secret=mzmedia_zlm_secret_2026_test_key
alive_interval=10.0
enable=1
on_flow_report=
on_http_access=
on_play=http://host.docker.internal:48080/index/hook/on_play
on_publish=http://host.docker.internal:48080/index/hook/on_publish
on_record_mp4=http://host.docker.internal:48080/index/hook/on_record_mp4
on_record_ts=
on_rtp_server_timeout=http://host.docker.internal:48080/index/hook/on_rtp_server_timeout
on_rtsp_auth=
on_rtsp_realm=
on_send_rtp_stopped=http://host.docker.internal:48080/index/hook/on_send_rtp_stopped
on_server_exited=
on_server_keepalive=http://host.docker.internal:48080/index/hook/on_server_keepalive
on_server_started=http://host.docker.internal:48080/index/hook/on_server_started
on_shell_login=
on_stream_changed=http://host.docker.internal:48080/index/hook/on_stream_changed
on_stream_none_reader=http://host.docker.internal:48080/index/hook/on_stream_none_reader
on_stream_not_found=http://host.docker.internal:48080/index/hook/on_stream_not_found
retry=1
retry_delay=3.0
timeoutSec=20

[http]
charSet=utf-8
dirMenu=0
keepAliveSecond=30
maxReqBody=4096000
maxReqSize=409600
notFound=<html><head><title>404 Not Found</title></head><body bgcolor="white"><center><h1>404 Not Found</h1></center><hr><center>ZLMediaKit</center></body></html>
port=80
rootPath=./www
sendBufSize=65536
sslport=443

[multicast]
addrMin=239.0.0.0
addrMax=239.255.255.255
udpTTL=64

[record]
appName=record
filePath=./www/record
fileBufSize=65536
fileRepeat=0
sampleMS=500
fastStart=0
fileSecond=3600

[rtmp]
handshakeSecond=15
keepAliveSecond=15
modifyStamp=0
port=1935
sslport=19350

[rtp]
audioMtuSize=600
clearCycle=5
rtpMaxSize=10
videoMtuSize=1400

[rtp_proxy]
check_source=1
dumpDir=
gop_cache=1
h264_pt=98
h265_pt=99
opus_pt=100
port=10000
port_range=30000-30500
ps_pt=96
timeoutSec=15

[rtc]
externIP=
port=8000
rembBitRate=0
tcpPort=0
timeoutSec=15

[rtsp]
authBasic=0
directProxy=1
handshakeSecond=15
keepAliveSecond=15
port=554
sslport=332

[srt]
latencyMul=4
pktBufSize=8192
port=9000
timeoutSec=5
